defaults:
  !INC {{ HOMEglobal }}/dev/parm/config/gfs/yaml/defaults.yaml
base:
  DOIAU: "YES"
  DO_JEDISNOWDA: "YES"
  DO_GSISOILDA: "NO"
  DO_LAND_IAU: ".false."
  DO_JEDISOILDAVAR: "YES"
  DO_JEDISOILDAENS: "YES"
  DO_SOILHYBVAR: "NO"
  DO_JEDIATMVAR: "NO"
  DO_JEDIATMENS: "NO"
  DO_JEDIATMENS_SPLIT_OBSSOL: "NO"
  INTERVAL_GFS: 0
  DO_TEST_MODE: "NO"
  USE_IODADIR: "YES"

# Fix file override test (feature/fix-file-UI-compatibility-test).
# Sources are marked copies made by dev/ci/scripts/make_fixtest_files.sh;
# run it once before setting up this case.
fix_files:
  replace:
    orog/C96/C96.mx500_oro_data.tile1.nc:             {{ HOMEglobal }}/fixtest/orog/C96/C96.mx500_oro_data.tile1.nc          # snowanl, soilanl*, fcst
    orog/C48/C48.mx500_oro_data.tile1.nc:             {{ HOMEglobal }}/fixtest/orog/C48/C48.mx500_oro_data.tile1.nc          # esnowanl
    gdas/fv3jedi/fv3files/fmsmpp.nml:                 {{ HOMEglobal }}/fixtest/gdas/fv3jedi/fv3files/fmsmpp.nml              # snow via FIXglobal, soil via FIXgdas
    gdas/snow/snow_bump_nicas_250km_shadowlevels_nicas.nc: {{ HOMEglobal }}/fixtest/gdas/snow/snow_bump_nicas_250km_shadowlevels_nicas.nc  # snow berror
    gdas/soil/soill1_bump_nicas_1000km.nc:            {{ HOMEglobal }}/fixtest/gdas/soil/soill1_bump_nicas_1000km.nc          # BCOV_DIR
